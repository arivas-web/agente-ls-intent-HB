name: daily-recalc
# Ingesta (HubSpot solo lectura) + recálculo + foto diaria. NO escribe en HubSpot (solo dry-run en change_log).
# El cron se activará tras revisar la Fase 1. España: 03:00 -> 01:00 UTC (verano) / 02:00 UTC (invierno).
on: workflow_dispatch
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src python -m vt.db.migrate
        env: {DATABASE_URL: "${{ secrets.DATABASE_URL }}"}
      - run: PYTHONPATH=src python -m vt.ingest.hubspot_ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
      - run: PYTHONPATH=src python -m vt.recalc
        env: {DATABASE_URL: "${{ secrets.DATABASE_URL }}"}
