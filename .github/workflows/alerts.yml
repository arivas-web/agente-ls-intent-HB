name: alerts
# Cada hora, lunes a viernes. 07-17 UTC cubre 09:00-18:00 Madrid en verano e invierno; el código filtra por hora de Madrid.
on:
  schedule:
    - cron: "5 7-17 * * 1-5"
  workflow_dispatch:
    inputs:
      force: {description: "Ignorar el horario (FORCE=1)", type: boolean, default: false}
permissions:
  contents: read
concurrency: {group: vt-data, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      VT_HUBSPOT_APPLY: ${{ vars.VT_HUBSPOT_APPLY }}
      FORCE: ${{ inputs.force && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - id: g
        run: PYTHONPATH=src python -c "from vt.timeguard import forced,in_window; from vt.config import load; w=load('alerts')['window']; print('go='+str(forced() or in_window(w['weekdays'],w['from'],w['to'])).lower())" >> "$GITHUB_OUTPUT"
      - if: steps.g.outputs.go == 'true'
        run: |
          export PYTHONPATH=src
          python -m vt.ingest.refresh_a
          python -m vt.recalc
          python -m vt.alerts
