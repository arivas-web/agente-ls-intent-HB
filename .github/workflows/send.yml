name: weekly-send
# Envío semanal: lunes 08:00 Madrid (06:00 UTC verano / 07:00 UTC invierno). SOLO si el reparto está VALIDADO.
on:
  schedule:
    - cron: "0 6 * * 1"
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      force: {description: "Ignorar la hora (FORCE=1)", type: boolean, default: false}
permissions:
  contents: read
concurrency: {group: vt-data, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      VT_HUBSPOT_APPLY: ${{ vars.VT_HUBSPOT_APPLY }}
      FORCE: ${{ inputs.force && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: |
          export PYTHONPATH=src
          python -m vt.send_weekly
          python -m vt.hubspot.sync
