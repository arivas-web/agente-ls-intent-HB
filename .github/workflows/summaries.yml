name: summaries
# Resúmenes de Claude (Claude Code con tu suscripción) para las cuentas del borrador que aún no los tienen.
# NO regenera el borrador ni toca tus cambios del dashboard. Manual, y automático el lunes 07:00 Madrid (antes del envío de las 08:00).
on:
  schedule:
    - cron: "0 5 * * 1"
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency: {group: vt-summaries, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '0' }}
    steps:
      - name: Comprobar token de Claude
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::El secreto CLAUDE_CODE_OAUTH_TOKEN no está disponible en este repositorio (Settings > Secrets and variables > Actions > Repository secrets)."
            exit 1
          fi
      - name: Limpiar token de Claude (quita saltos de línea y espacios al pegarlo)
        run: |
          clean="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
          if [ -n "$clean" ]; then
            echo "::add-mask::$clean"
            echo "CLAUDE_CODE_OAUTH_TOKEN=$clean" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Instalar Claude Code
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm install -g @anthropic-ai/claude-code
      - run: PYTHONPATH=src python -m vt.assign.summaries
