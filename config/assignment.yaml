# Reparto semanal
accounts_per_sdr_per_week: 10
sdrs:                          # owner IDs de HubSpot (comprobados con la sonda 2026-10-02)
  Emma:  {owner_id: "29462762"}   # Emma González Sánchez
  Laura: {owner_id: "29743324"}   # Laura Díaz
draft:  {weekday: thu, time: "09:00", tz: Europe/Madrid}   # supuesto, cambiable
send:   {weekday: mon, time: "08:00", tz: Europe/Madrid}   # confirmado
excluded_statuses: [Client, On prospection, Engaged, Contacted, Meeting]
inactivity_months_for_control: 6
control_per_sdr: 2               # SUPUESTO: de las 10 cuentas por SDR, 2 son grupo de control (aleatorias, sin actividad en 6 meses)
control_min_fit_tier: B           # SUPUESTO: el grupo de control sale de cuentas de fit A o B (evita basura C)
candidate_pool_size: 60           # candidatos ordenados que se guardan para "sustituir por la siguiente"
random_seed_salt: "vt"            # la semilla = salt + fecha de la semana; se guarda para reproducir el sorteo
excluded_company_types: [Asociaciones del sector, Cliente, Competencia, Partner, Prensa]
# Empresas propias: nunca se reparten, no generan alertas ni puntuaciones y sus contactos se excluyen.
# Se comparan por nombre normalizado EXACTO (sin S.L./S.A.); sus dominios en HubSpot se añaden solos a los internos.
internal_company_names: [Visual Trans, Visual Microsystems, Docuten]
internal_domains: [visualtrans.com, visualms.com]
