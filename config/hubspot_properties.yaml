# Nombres internos de propiedades de HubSpot CONFIRMADOS por el usuario.
# Regla: no añadir ni cambiar nada aquí sin confirmación. Si un nombre deja de
# existir en la API, avisar; no buscar otro.
company:
  target_market: target_market          # confirmado 2026-10-02 (enumeración)
  proveedor_actual: proveedores         # confirmado 2026-10-02 (enumeración; mapeo valor->puntos con coincidencia aproximada, ver config/fit.yaml)
  ubicacion: pais                       # confirmado 2026-10-02 (enumeración)
  estado_prospeccion: company___status  # confirmado 2026-10-02 (enumeración)
  tipo_de_contacto: tipo_de_contacto    # confirmado 2026-10-02 (enumeración, EMPRESA); los contactos heredan la exclusión de su empresa. Excluir: Asociaciones del sector, Cliente, Competencia, Partner, Prensa. Mantener: Precliente, No target, vacío
contact:
  cargo: cargo_icp                      # confirmado 2026-10-02 (enumeración; no hace falta clasificar con Claude)
  telefono:                             # confirmado 2026-10-02 (todas las relacionadas salvo WhatsApp)
    - mobilephone
    - phone
  linkedin_url: hs_linkedin_url         # confirmado 2026-10-02
contact_activity:                     # propuestas en PLAN.md §1 (historial de propiedades); aprobadas con el 'dale' del plan
  last_url: hs_analytics_last_url
  visits: hs_analytics_num_visits
  email_clicks: hs_email_click
  email_last_click: hs_email_last_click_date       # cada versión = un clic con su fecha
  last_visit: hs_analytics_last_visit_timestamp   # cada versión = una sesión web
  email_optout: hs_email_optout
  email_bounce: hs_email_bounce
  email_last_replied: hs_sales_email_last_replied
company_activity:                     # última actividad de la empresa (para el grupo de control: 6 meses sin actividad)
  - notes_last_updated
  - hs_last_sales_activity_timestamp
  - hs_analytics_last_visit_timestamp
deal: {}
opportunities:
  source: venzo_only   # confirmado 2026-10-02: los deals de HubSpot no se usan como oportunidades
excluded_contact_types:
  - Asociaciones del sector
  - Cliente
  - Competencia
  - Partner
  - Prensa
